[project]
name = "iol-mobile-optics"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "optrace @ git+https://github.com/drocheam/optrace.git@adad608acedb08c2d99688613fa01034865c9d47",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pillow>=11,<13",
  "pymupdf>=1.26,<2",
]

[project.optional-dependencies]
calibration = ["matplotlib>=3.10,<4"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/iol_sim"]
[tool.hatch.metadata]
allow-direct-references = true
